<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rest Alert Reach Spike</title>
<style>
  body { font: 16px -apple-system, sans-serif; margin: 0; padding: 16px;
         background: #111; color: #eee; }
  h1 { font-size: 20px; }
  button { font-size: 18px; padding: 14px 18px; margin: 6px 0; width: 100%;
           border: 0; border-radius: 10px; background: #2d6cdf; color: #fff; }
  button.secondary { background: #444; }
  #log { white-space: pre-wrap; font: 13px ui-monospace, monospace;
         background: #000; padding: 10px; border-radius: 8px; margin-top: 14px; }
  #count { font-size: 44px; font-weight: 700; text-align: center; margin: 12px 0; }
  .hint { color: #999; font-size: 14px; }
</style>
</head>
<body>
<h1>Rest alert reach</h1>
<p class="hint">Press a button, then immediately switch apps or lock the phone.
Listen for a beep after 30 seconds.</p>
<label class="hint">Audio session category:
  <select id="sessionType" style="font-size:17px;padding:8px;width:100%;margin:6px 0;">
    <option value="playback" selected>playback — survives background, interrupts music</option>
    <option value="ambient">ambient — mixes with music, dies in background</option>
    <option value="auto">auto — platform default</option>
    <option value="none">none — don't set it at all</option>
  </select>
</label>
<div id="count">--</div>
<button id="startOneShot">A: 30s one-shot track (best bet)</button>
<button id="start" class="secondary">B: 30s keepalive + JS-timed tone</button>
<button id="startNoKeepalive" class="secondary">C: 30s JS-timed, no keepalive</button>
<button id="toneNow" class="secondary">D: Play tone now (sanity check)</button>
<button id="copyLog" class="secondary">Copy log to clipboard</button>
<div id="log"></div>

<script>
const logEl = document.getElementById('log');
const countEl = document.getElementById('count');
function log(msg) {
  const t = new Date().toLocaleTimeString();
  logEl.textContent += `[${t}] ${msg}\n`;
}

// --- WAV generators (no assets, no network) ---
function wavHeader(view, numSamples, sampleRate) {
  const w = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  w(0, 'RIFF');
  view.setUint32(4, 36 + numSamples, true);
  w(8, 'WAVE'); w(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);          // PCM
  view.setUint16(22, 1, true);          // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate, true); // byte rate (8-bit mono)
  view.setUint16(32, 1, true);          // block align
  view.setUint16(34, 8, true);          // bits per sample
  w(36, 'data');
  view.setUint32(40, numSamples, true);
}

function silentWavUrl(seconds) {
  const sampleRate = 8000;
  const n = sampleRate * seconds;
  const buf = new ArrayBuffer(44 + n);
  const view = new DataView(buf);
  wavHeader(view, n, sampleRate);
  for (let i = 0; i < n; i++) view.setUint8(44 + i, 128); // 8-bit unsigned silence
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

function toneWavUrl(freq, seconds) {
  const sampleRate = 8000;
  const n = Math.floor(sampleRate * seconds);
  const buf = new ArrayBuffer(44 + n);
  const view = new DataView(buf);
  wavHeader(view, n, sampleRate);
  for (let i = 0; i < n; i++) {
    const t = i / sampleRate;
    const env = Math.min(1, t * 20, (seconds - t) * 20);
    const v = Math.sin(2 * Math.PI * freq * t) * env;
    view.setUint8(44 + i, Math.max(0, Math.min(255, Math.round(128 + v * 100))));
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

/**
 * One track: `silenceSeconds` of silence, then the beep. Started inside the
 * user gesture and left to play through, so NO JavaScript needs to run at
 * fire time. This matters because iOS suspends timers in backgrounded tabs -
 * an approach that calls play() from a setInterval callback cannot fire if
 * the tab is frozen, no matter how the deadline is computed.
 */
function silenceThenToneWavUrl(silenceSeconds, freq, toneSeconds) {
  const sampleRate = 8000;
  const nSil = Math.floor(sampleRate * silenceSeconds);
  const nTone = Math.floor(sampleRate * toneSeconds);
  const n = nSil + nTone;
  const buf = new ArrayBuffer(44 + n);
  const view = new DataView(buf);
  wavHeader(view, n, sampleRate);
  for (let i = 0; i < nSil; i++) view.setUint8(44 + i, 128);
  for (let i = 0; i < nTone; i++) {
    const t = i / sampleRate;
    const env = Math.min(1, t * 20, (toneSeconds - t) * 20);
    const v = Math.sin(2 * Math.PI * freq * t) * env;
    view.setUint8(44 + nSil + i, Math.max(0, Math.min(255, Math.round(128 + v * 100))));
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

// Built lazily on first interaction, NOT at page load. Constructing Audio
// elements eagerly makes it impossible to tell whether merely opening the
// page claimed the audio session, or whether a test did.
let keepalive = null, tone = null, oneShot = null;

function ensureAudio() {
  if (oneShot) return;
  keepalive = new Audio(silentWavUrl(1));
  keepalive.loop = true;
  tone = new Audio(toneWavUrl(880, 1.2));
  oneShot = new Audio(silenceThenToneWavUrl(30, 880, 1.5));
  log('audio elements created');
}

/**
 * The audio session category decides whether playback survives backgrounding.
 *   ambient  - mixes with other audio, but is silenced when backgrounded
 *              or when the ringer switch is off. Measured: playback froze.
 *   playback - media intended to keep running in the background. Takes over
 *              the audio session, so it interrupts the user's own music.
 *   auto     - leave it to the platform.
 * Must be set BEFORE play() for the category to apply to that playback.
 */
function requestSession() {
  const want = document.getElementById('sessionType').value;
  if (want === 'none') { log('audioSession: left at platform default'); return; }
  if (!('audioSession' in navigator)) { log('navigator.audioSession NOT available'); return; }
  try {
    navigator.audioSession.type = want;
    log('audioSession.type = "' + want + '" -> actual: ' + navigator.audioSession.type);
  } catch (e) {
    log('audioSession set FAILED: ' + e.message);
  }
}

let running = false;

/**
 * iOS only permits programmatic play() on an element a user gesture has
 * already started. Starting and immediately stopping the tone inside the
 * click handler unlocks it for the timed play 30s later. Without this,
 * play() rejects with NotAllowedError no matter what else is going on.
 * Must run synchronously in the handler, before any await consumes the
 * user activation.
 */
function primeTone() {
  const p = tone.play();
  if (!p || typeof p.then !== 'function') {
    return Promise.resolve('prime: no promise returned');
  }
  return p.then(() => {
    tone.pause();
    tone.currentTime = 0;
    return 'tone primed OK';
  }).catch(e => 'tone prime FAILED: ' + e.message);
}

function run(useKeepalive) {
  if (running) { log('already running'); return; }
  running = true;
  logEl.textContent = '';

  log('UA: ' + navigator.userAgent);
  log('standalone: ' + (window.navigator.standalone === true));
  ensureAudio();
  requestSession();

  // Both play() calls are issued synchronously inside the gesture.
  const primed = primeTone();
  const kaStarted = useKeepalive
    ? keepalive.play().then(() => 'keepalive playing').catch(e => 'keepalive FAILED: ' + e.message)
    : Promise.resolve('keepalive skipped');

  primed.then(log);
  kaStarted.then(log);

  const end = Date.now() + 30000;
  const tick = setInterval(() => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    countEl.textContent = left;
    if (left === 0) {
      clearInterval(tick);
      log('firing tone (visibility=' + document.visibilityState +
          ', keepalive paused=' + keepalive.paused + ')');
      tone.play()
        .then(() => log('TONE PLAY RESOLVED'))
        .catch(e => log('TONE PLAY REJECTED: ' + e.name + ' - ' + e.message));
      keepalive.pause();
      running = false;
    }
  }, 250);
}

/**
 * Mode A. Starts one pre-rendered track inside the gesture and lets it run.
 * The countdown here is cosmetic only - if it freezes while backgrounded
 * that is expected and does not affect whether the beep fires.
 */
function runOneShot() {
  if (running) { log('already running'); return; }
  running = true;
  logEl.textContent = '';

  log('UA: ' + navigator.userAgent);
  log('standalone: ' + (window.navigator.standalone === true));
  // Create, set category, then play - all synchronous, so user activation survives.
  ensureAudio();
  requestSession();

  oneShot.currentTime = 0;
  const started = oneShot.play()
    .then(() => 'one-shot playing; beep is baked in at 30s, no JS needed to fire it')
    .catch(e => 'one-shot play FAILED: ' + e.name + ' - ' + e.message);

  started.then(log);

  oneShot.addEventListener('ended', () => {
    log('one-shot ENDED - playback ran to completion');
    running = false;
  }, { once: true });

  const end = Date.now() + 30000;
  const tick = setInterval(() => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    countEl.textContent = left;
    if (left === 0) {
      clearInterval(tick);
      log('cosmetic countdown hit zero (visibility=' + document.visibilityState + ')');
    }
  }, 250);
}

document.addEventListener('visibilitychange', () => {
  log('visibility -> ' + document.visibilityState);
  if (!oneShot) { log('  (no audio created yet)'); return; }
  // The decisive diagnostic. If currentTime advanced by roughly the time you
  // were away, audio kept playing while backgrounded. If it is frozen near
  // where you left, iOS suspended playback and no audio approach can work.
  log('  oneShot.currentTime=' + oneShot.currentTime.toFixed(1) +
      ' paused=' + oneShot.paused);
  log('  keepalive.paused=' + keepalive.paused);
});

document.getElementById('copyLog').onclick = async () => {
  const text = logEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    log('--- log copied to clipboard ---');
  } catch (e) {
    // Clipboard API needs a secure context; plain HTTP over LAN is not one.
    // Select the text instead so a long-press gives Copy.
    const range = document.createRange();
    range.selectNodeContents(logEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    log('--- clipboard blocked (needs HTTPS); log is selected, long-press to Copy ---');
  }
};

document.getElementById('startOneShot').onclick = runOneShot;
document.getElementById('start').onclick = () => run(true);
document.getElementById('startNoKeepalive').onclick = () => run(false);
document.getElementById('toneNow').onclick = () => {
  logEl.textContent = '';
  ensureAudio();
  requestSession();
  tone.play()
    .then(() => log('direct tone play OK - the WAV itself is fine'))
    .catch(e => log('direct tone play FAILED: ' + e.name + ' - ' + e.message));
};
</script>
</body>
</html>
