name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race, but let an in-flight production deploy finish
# rather than killing it mid-flight -- queued runs wait their turn instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Tests gate the deploy: a red suite must never reach the phone.
      - run: npm test
      - run: npm run build
      # The backup round trip gates the deploy the same way. It runs against
      # the build above, so it has to come after it, and before the upload
      # below: a broken backup stops here and never reaches the phone.
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test
      # A red round trip stops the deploy on a runner nobody can open. The
      # traces and screenshots it leaves in test-results/ are all there is to
      # diagnose it from.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
